# Skip (https://skip.dev) configuration for the FormsKit module.
#
# FormsKit is a natively-compiled Skip Fuse module: the Swift source is
# compiled as-is for Android with the Swift SDK for Android, so the
# @Validated property wrapper and the KeyPath-driven focus system work
# unchanged (neither is expressible in Skip's transpiled mode).
#
# Bridging is required: FormsKit's wrapper Views (the four form-control
# modifiers) need Kotlin peers so they render on Android. Custom Views bridge
# fine; module-wide bridging is safe. If the generator produces problematic
# Kotlin for other API, scope it down with `// SKIP @nobridge` on those
# declarations (never on the wrapper Views themselves).
skip:
  mode: 'native'
  bridging: true
